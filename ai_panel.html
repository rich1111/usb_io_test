<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebUSB 8-Ch AI 儀表板 (Float64)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
        }

        h2 {
            color: #00bcd4;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .control-panel {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        button {
            background-color: #00bcd4;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #008ba3;
        }

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        /* AI 儀表板網格排版 */
        .ai-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .ai-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border-top: 4px solid #333;
            transition: border-color 0.3s;
        }

        .ai-card.active {
            border-top: 4px solid #00bcd4;
        }

        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .ai-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #aaa;
        }

        .ai-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 顯示原始 8-byte Hex Payload */
        .ai-raw-payload {
            font-size: 0.75rem;
            color: #00bcd4;
            background: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* 進度條 (長條圖) */
        .bar-bg {
            width: 100%;
            height: 16px;
            background-color: #333;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 8px;
            transition: width 0.1s linear;
        }

        .bar-fill.warning {
            background: linear-gradient(90deg, #ff9800, #f44336);
        }

        #log {
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #333;
        }
    </style>
</head>

<body>

    <h2>📊 8-Ch 類比信號採集 (Double Precision Float64)</h2>

    <div class="control-panel">
        <button id="connectBtn">🔌 連接 RK3506 設備</button>
        <span id="status" style="color: #f44336; font-weight: bold;">● 未連線</span>
        <div style="margin-left: auto;">
            <label for="pollRate">採集頻率: </label>
            <select id="pollRate" style="padding: 5px; background: #333; color: white; border: 1px solid #555;">
                <option value="50">50 ms (高速)</option>
                <option value="100" selected>100 ms (標準)</option>
                <option value="500">500 ms (省電)</option>
            </select>
        </div>
    </div>

    <!-- 動態生成 8 個 AI 通道的圖表 -->
    <div class="ai-grid" id="ai-grid"></div>

    <div class="control-panel" style="display: block;">
        <h3 style="margin-top: 0; color: #aaa;">系統日誌</h3>
        <div id="log"></div>
    </div>

    <script>
        // --- 參數設定 ---
        const VID = 0x2207;
        const PID = 0x0013;
        const UsbHeaderByte = 0xAA;
        const CmdReadAI = 0x03;

        // UI 長條圖顯示上限 (假設滿量程為 10.0，若您的感測器範圍不同可於此修改)
        const DisplayMaxVoltage = 10.0;

        let usbDevice = null;
        let epOut = null, epIn = null;
        let isPolling = false;
        let pollTimer = null;

        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('status');
        const logDiv = document.getElementById('log');
        const pollRateSelect = document.getElementById('pollRate');

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // 將位元組陣列轉換為 Hex 字串 (例如: 0A 1B 2C ...)
        function bytesToHex(bytes) {
            return Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
        }

        // --- 初始化 8 個通道的 UI ---
        const grid = document.getElementById('ai-grid');
        for (let i = 0; i < 8; i++) {
            grid.innerHTML += `
            <div class="ai-card" id="card-${i}">
                <div class="ai-header">
                    <div class="ai-title">Channel ${i}</div>
                    <div class="ai-value" id="val-${i}">0.0000</div>
                </div>
                <div class="ai-raw-payload" id="payload-${i}">[00 00 00 00 00 00 00 00]</div>
                <div class="bar-bg">
                    <div class="bar-fill" id="bar-${i}"></div>
                </div>
            </div>
        `;
        }

        // --- WebUSB 連線 ---
        connectBtn.addEventListener('click', async () => {
            try {
                usbDevice = await navigator.usb.requestDevice({ filters: [{ vendorId: VID }] });
                await usbDevice.open();
                await usbDevice.selectConfiguration(1);

                // ==========================================
                // 🌟 動態尋找 Class 255 (Vendor Specific) 的介面編號
                // ==========================================
                // ==========================================
                // 🌟 極致精準定位：完全匹配韌體定義
                // ==========================================
                let targetIntfNum = -1;
                let targetAlt = null;

                for (const intf of usbDevice.configuration.interfaces) {
                    for (const alt of intf.alternates) {
                        // 必須同時滿足 Class, Subclass, Protocol 才能確定是 AI 介面
                        if (alt.interfaceClass === 255 && alt.interfaceSubclass === 0 && alt.interfaceProtocol === 0) {
                            targetIntfNum = intf.interfaceNumber;
                            targetAlt = alt;
                            break;
                        }
                    }
                    if (targetIntfNum !== -1) break;
                }

                if (targetIntfNum === -1) {
                    throw new Error("找不到 Class 255 的自訂 AI 介面！");
                }

                addLog(`🔍 自動定位到 Native I/O 介面: Interface ${targetIntfNum}`);

                // 宣告接管找到的介面 (此時應該會是 3)
                await usbDevice.claimInterface(targetIntfNum);

                targetAlt.endpoints.forEach(ep => {
                    if (ep.direction === 'out' && ep.type === 'bulk') epOut = ep.endpointNumber;
                    if (ep.direction === 'in' && ep.type === 'bulk') epIn = ep.endpointNumber;
                });

                if (epOut && epIn) {
                    statusText.innerHTML = `● 雙精度浮點採集中 (Intf ${targetIntfNum})`;
                    statusText.style.color = "#00bcd4";
                    connectBtn.disabled = true;
                    addLog(`✅ AI 設備連線成功！開始解碼 Float64 數據...`);

                    isPolling = true;
                    startPolling();
                } else {
                    throw new Error("找不到 Bulk 端點");
                }
            } catch (error) {
                addLog(`❌ 連線失敗: ${error.message}`);
            }
        });

        // --- AI 輪詢迴圈 ---
        async function startPolling() {
            if (!isPolling || !usbDevice) return;
            const interval = parseInt(pollRateSelect.value);

            try {
                for (let ch = 0; ch < 8; ch++) {
                    // 發送讀取請求
                    const cmd = new Uint8Array([UsbHeaderByte, CmdReadAI, ch, 0x00]);
                    await usbDevice.transferOut(epOut, cmd);

                    // 讀取響應
                    const result = await usbDevice.transferIn(epIn, 64);
                    const data = new Uint8Array(result.data.buffer);

                    // 驗證封包: 長度 >= 11, 且 Header 吻合
                    if (data.length >= 11 && data[0] === UsbHeaderByte && data[1] === CmdReadAI && data[2] === ch) {

                        // 擷取 3~10 索引的 8 Bytes Payload
                        const payloadBytes = data.slice(3, 11);

                        // 🌟 關鍵解析: 使用 DataView 讀取 Little-Endian 的 float64
                        const dataView = new DataView(data.buffer, data.byteOffset, data.byteLength);
                        const aiValue = dataView.getFloat64(3, true); // 參數 true 代表 Little-Endian

                        updateAiUI(ch, aiValue, payloadBytes);
                    }
                }
                document.querySelectorAll('.ai-card').forEach(c => c.classList.add('active'));

            } catch (error) {
                addLog(`⚠️ 讀取錯誤: ${error}`);
                document.querySelectorAll('.ai-card').forEach(c => c.classList.remove('active'));
            }
            pollTimer = setTimeout(startPolling, interval);
        }

        // --- 更新畫面 ---
        function updateAiUI(channel, floatValue, payloadBytes) {
            // 更新浮點數文字 (保留 4 位小數以匹配您的 C 程式碼輸出)
            document.getElementById(`val-${channel}`).innerText = floatValue.toFixed(4);

            // 更新 Payload Hex 顯示
            document.getElementById(`payload-${channel}`).innerText = `[${bytesToHex(payloadBytes)}]`;

            // 計算長條圖進度 (將數值映射至 0% ~ 100%)
            let percentage = (Math.abs(floatValue) / DisplayMaxVoltage) * 100;
            percentage = Math.min(percentage, 100); // 最高 100%

            const bar = document.getElementById(`bar-${channel}`);
            bar.style.width = percentage + "%";

            // 若數值超過設定滿量程的 85%，顯示警告色
            if (percentage > 85) {
                bar.classList.add('warning');
            } else {
                bar.classList.remove('warning');
            }
        }

        pollRateSelect.addEventListener('change', () => {
            if (isPolling) {
                clearTimeout(pollTimer);
                startPolling();
            }
        });
    </script>
</body>

</html>
